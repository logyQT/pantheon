plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// ── .env support ─────────────────────────────────────
def envFile = file('.env')
if (envFile.exists()) {
	envFile.readLines().each { line ->
		line = line.trim()
		if (line.isEmpty() || line.startsWith('#')) return
		def parts = line.split('=', 2)
		if (parts.length == 2) {
			project.ext[parts[0].trim()] = parts[1].trim()
		}
	}
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pantheon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// NanoVG for clickgui rendering
	implementation "org.lwjgl:lwjgl-nanovg:3.4.1"
	include "org.lwjgl:lwjgl-nanovg:3.4.1"
	implementation "org.lwjgl:lwjgl-nanovg:3.4.1:natives-windows"
	include "org.lwjgl:lwjgl-nanovg:3.4.1:natives-windows"

	implementation "org.xerial:sqlite-jdbc:3.45.2.0"
	include "org.xerial:sqlite-jdbc:3.45.2.0"


	implementation "org.mozilla:rhino:1.9.1"
	include "org.mozilla:rhino:1.9.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.register('linkMod') {
	def enabled = project.ext.has('copy_jar_to') ? Boolean.parseBoolean(project.ext.get('copy_jar_to')) : false
	def targetDir = project.ext.has('copy_jar_dir') ? project.ext.get('copy_jar_dir') : ''
	doLast {
		if (!enabled) { println "[linkMod] disabled (copy_jar_to=false)"; return }
		if (targetDir.isEmpty()) { println "[linkMod] no target dir (copy_jar_dir not set)"; return }
		def modDir = file(targetDir)
		def baseName = project.archives_base_name
		def libs = fileTree('build/libs') {
			include "${baseName}-*.jar"
			exclude '*-sources.jar'
		}
		def jar = libs.files.max { it.lastModified() }

		if (jar == null) throw new GradleException("No jar found in build/libs")

		def link = new File(modDir, "${baseName}.jar")

		modDir.mkdirs()
		// Retry deleteIfExists up to 3 times with 500ms delay (handles locked jars)
		def deleted = false
		for (int attempt = 1; attempt <= 3; attempt++) {
			try {
				java.nio.file.Files.deleteIfExists(link.toPath())
				deleted = true
				break
			} catch (Exception e) {
				if (attempt < 3) {
					println "[linkMod] Attempt $attempt to delete failed, retrying in 500ms..."
					Thread.sleep(500)
				} else {
					println "[linkMod] Warning: could not delete existing file after 3 attempts"
				}
			}
		}
		link.bytes = jar.bytes
		println "[linkMod] Copied: ${link} <- ${jar.name}"
	}
}

build.finalizedBy linkMod

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}